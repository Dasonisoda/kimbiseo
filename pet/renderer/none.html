<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>김비서 펫</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; font-family: "Malgun Gothic", sans-serif; }
  #card { position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%); width: 62%; max-width: 300px; box-sizing: border-box; padding: 16px;
    background: #ffffff; color: #262b40; border: 1px solid #d8dcea; border-radius: 14px; box-shadow: 0 6px 18px rgba(30, 30, 70, 0.18); text-align: center; cursor: pointer; }
  #card img { width: 64px; height: 64px; display: block; margin: 0 auto 8px; }
  #card b { display: block; font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  #card span { display: block; font-size: 13px; color: #5d6382; line-height: 1.45; word-break: keep-all; }
  #card.over { border-color: #FF005A; }
  #bubble { position: fixed; left: 50%; top: 12%; transform: translateX(-50%); max-width: 80%; padding: 8px 12px; background: #fff; color: #262b40;
    border: 1px solid #FF005A; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.18s; word-break: keep-all; }
  #bubble.show { opacity: 1; }
</style>
</head>
<body>
<div id="card"><img src="img/icon.png" alt=""><b>옷이 아직 없어요</b><span>여기를 누르면 「옷 더 받기」가 열려요.<br>오른쪽 클릭 = 메뉴</span></div>
<div id="bubble"></div>
<script src="none.js"></script>
</body>
</html>
