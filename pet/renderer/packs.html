<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>김비서 펫 옷 관리</title>
<style>
  /* 메뉴(menu.html)와 같은 모양: 색 하나(분홍, 운영 캐릭터펫과 같은 색), 테두리 1px, 간격 8 단위 */
  :root { --ink: #262b40; --sub: #5d6382; --line: #d8dcea; --hover: #f2a7c3; --accent: #FF005A; --accent-ink: #D6004C; --accent-soft: #fff0f5; --bg: #ffffff; --danger: #b4233a; }
  html, body { margin: 0; height: 100%; background: transparent; font-family: "Malgun Gothic", sans-serif; color: var(--ink); user-select: none; overflow: hidden; }
  #card { position: absolute; inset: 8px; display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(30, 30, 70, 0.18); padding: 8px 16px 12px; box-sizing: border-box; }
  header { display: flex; align-items: center; justify-content: space-between; -webkit-app-region: drag; }
  header b { font-size: 18px; font-weight: 600; }
  #x { width: 40px; height: 40px; border: 0; background: transparent; font-size: 24px; color: var(--sub); border-radius: 8px; cursor: pointer; margin-right: -8px; -webkit-app-region: no-drag; }
  #x:hover { background: #f1f2f7; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
  .btn { min-height: 40px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font: inherit; font-size: 15px; font-weight: 500; color: var(--ink); cursor: pointer; padding: 0 12px; }
  .btn:hover { border-color: var(--hover); }
  .btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .btn:disabled { color: #a3a7b8; border-color: #e6e8f0; cursor: default; background: #fafbfd; }
  .btn.del { color: var(--danger); }
  .btn.del:disabled { color: #a3a7b8; }
  .btn.go { border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.small { min-height: 34px; font-size: 14px; padding: 0 10px; }
  #list { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
  .row { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 8px; margin-bottom: 8px; }
  .row.on { border-color: var(--accent); background: var(--accent-soft); }
  .row img, .row .noimg { width: 72px; height: 90px; object-fit: cover; border-radius: 8px; background: #f1f2f7; display: block; }
  .row .name { font-size: 15px; font-weight: 600; line-height: 1.3; word-break: keep-all; }
  .row .meta { font-size: 13px; color: var(--sub); margin-top: 4px; line-height: 1.4; }
  .row .meta .ok { color: #1f7a4d; font-weight: 600; }
  .row .meta .warn { color: var(--danger); font-weight: 600; }
  .acts { display: flex; flex-direction: column; gap: 6px; align-items: stretch; min-width: 84px; }
  .confirm { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 14px; font-weight: 600; color: var(--danger); }
  .confirm div { display: flex; gap: 8px; }
  .bar { height: 6px; background: #eceef5; border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
  .note { font-size: 13px; color: var(--sub); line-height: 1.45; margin: 4px 0 8px; }
  .foot { border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 6px; }
  #msg { min-height: 20px; font-size: 14px; color: var(--accent-ink); font-weight: 500; text-align: center; }
  .row.soon { opacity: 0.75; }
  .row .meta .soon { color: var(--sub); font-weight: 600; }
  .empty { text-align: center; color: var(--sub); font-size: 14px; padding: 24px 8px; line-height: 1.6; }
  #ask { position: absolute; inset: 8px; display: none; align-items: center; justify-content: center; background: rgba(38, 43, 64, 0.45); border-radius: 12px; }
  #ask.show { display: flex; }
  #ask .box { width: 82%; background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 8px 24px rgba(30, 30, 70, 0.25); }
  #ask b { display: block; font-size: 16px; color: var(--danger); margin-bottom: 8px; }
  #ask p { font-size: 14px; line-height: 1.5; margin: 0 0 12px; }
  #ask .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
</style>
</head>
<body>
<div id="card">
  <header><b>옷 관리</b><button id="x" title="닫기">×</button></header>
  <div class="tabs"><button class="btn" id="tabMine">내 옷</button><button class="btn" id="tabGet">옷 더 받기</button></div>
  <div id="list"></div>
  <div class="foot">
    <button class="btn" id="file">파일로 옷 추가(.hipcpet)</button>
    <div class="note">옷 꾸러미 파일(.hipcpet)을 펫 위에 끌어 놓아도 들어가요. 김비서 옷의 움직임은 AI 로 만든 영상(MiniMax H3)이에요.</div>
    <div id="msg"></div>
  </div>
</div>
<div id="ask"><div class="box">
  <b>정품 서명이 없는 옷 꾸러미예요</b>
  <p id="askText"></p>
  <div class="two"><button class="btn" id="askNo">넣지 않기</button><button class="btn del" id="askYes">그래도 넣기</button></div>
</div></div>
<script src="wardrobe.js"></script>
</body>
</html>
